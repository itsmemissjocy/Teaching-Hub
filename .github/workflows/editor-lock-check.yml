name: Refresh editor dependency lockfile
on:
  push:
    branches:
      - feature/document-editor-v2
    paths:
      - .github/workflows/editor-lock-check.yml
permissions:
  contents: write
jobs:
  validate-and-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean dependency install
        run: npm ci
      - name: Build Teaching Hub
        run: npm run build
      - name: Save updated lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Lock Tiptap editor dependencies"
            git push
          fi
